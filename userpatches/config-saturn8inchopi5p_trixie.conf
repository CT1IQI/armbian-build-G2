PFORM='saturn-opi5p' # saturn-cm5 | io | rf2ks ; platform choice
FRONT='-8inch' # '' | '-7inch' | '-8inch'
KVRS='-k701'   # '-k612' | '-k613' | '-k614' | '-k615' | '-k617' | '-k618' | '-k701' | '-k702' kernel version
BOARD="${PFORM}"'-rk3588'
export FRONT=$FRONT
export KVRS=$KVRS
export PFORM=$PFORM
BRANCH='edge'  # 'vendor' | 'current' | 'edge'
RELEASE='trixie'
BUILD_DESKTOP='no'
BUILD_MINIMAL='no'
KERNEL_CONFIGURE='no'
INSTALL_HEADERS='yes'
INCLUDE_HOME_DIR='yes'
#CLEAN_LEVEL=make,debs,cache,oldcache
CLEAN_LEVEL="images,oldcache"
SKIP_ARMBIAN_REPO='yes'
# BSPFREEZE='yes'
# FIXED_IMAGE_SIZE=8000
KERNEL_GIT='shallow'

#Ponha ao fim do comando compile.sh
#kernel: Compila apenas o kernel, os módulos, a device tree e o u-boot, gerando os pacotes .deb na pasta output/debs/.
#kernel-config: Abre diretamente o menu interativo de configuração (menuconfig) do kernel sem avançar para a compilação completa.
#uboot: Compila estritamente o bootloader para a placa selecionada

